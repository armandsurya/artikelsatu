
<!doctype html><html><head><meta charset=utf-8>
<link rel=stylesheet href=/node_modules/ckeditor5/dist/ckeditor5.css>
<style>#e{border:1px solid #ccc;min-height:400px}</style></head>
<body><div id=e></div>
<script type=module>
try {
  const c = await import('/node_modules/ckeditor5/dist/ckeditor5.js');
  window.__ck = c;
  const plugins = ['Essentials','Paragraph','Heading','Bold','Italic','Underline','Strikethrough','Subscript','Superscript','Code','CodeBlock','BlockQuote','Highlight','FontSize','FontFamily','FontColor','FontBackgroundColor','Alignment','Indent','IndentBlock','List','TodoList','ListProperties','Link','AutoLink','LinkImage','Image','ImageToolbar','ImageCaption','ImageStyle','ImageResize','ImageUpload','ImageInsertViaUrl','PictureEditing','Table','TableToolbar','TableProperties','TableCellProperties','TableColumnResize','TableCaption','HorizontalLine','RemoveFormat','FindAndReplace','WordCount','SourceEditing','HtmlEmbed','GeneralHtmlSupport','PasteFromOffice','AutoImage','SpecialCharacters','SpecialCharactersEssentials','Clipboard','ButtonView'];
  const missing = plugins.filter(p => !c[p]);
  window.__missing = missing;
  console.log('MISSING', JSON.stringify(missing));
  const good = plugins.filter(p => c[p]).map(p => c[p]);
  const ed = await c.ClassicEditor.create(document.getElementById('e'), {
    licenseKey: 'GPL',
    plugins: good,
    toolbar: ['bold','italic']
  });
  window.__ed = ed;
  console.log('EDITOR OK');
} catch (e) {
  console.log('EDITOR FAIL', e && e.message, e && e.stack);
  document.body.innerText = 'FAIL: ' + (e && e.message);
}
</script></body></html>
